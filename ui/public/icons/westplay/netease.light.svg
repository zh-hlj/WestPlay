<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    WestPlay's own placeholder for the NetEase Cloud Music app's icon: a red rounded square with a drawn cloud
    and note, not NetEase's own mark (it's a stand-in, to be replaced with a compliant, drawn one: TODO(verify)).
    The light look: a pale card with the red mark.
  -->
  <defs>
    <linearGradient id="face" x1="0" y1="48" x2="0" y2="975" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbfb" />
      <stop offset="0.5" stop-color="#f1f1f1" />
      <stop offset="1" stop-color="#e3e3e3" />
    </linearGradient>
    <linearGradient id="mark" x1="260" y1="260" x2="764" y2="764" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2648" />
      <stop offset="0.55" stop-color="#e60026" />
      <stop offset="1" stop-color="#b3001e" />
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#face)" />
  <rect x="24.75" y="24.75" width="974.5" height="974.5" rx="223.25" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="1.5" />
  <rect x="300" y="318" width="440" height="440" rx="110" fill="#000" fill-opacity="0.18" filter="url(#drop)" />
  <rect x="276" y="276" width="472" height="472" rx="118" fill="url(#mark)" />
  <!-- A cloud, its curl the note's head. -->
  <path
    d="M392 616c-46 0-82-35-82-79 0-41 32-75 74-78 8-64 61-113 126-113 55 0 102 35 120 84 50 9 80 49 80 95 0 54-45 91-102 91h-46v-56h44c30 0 48-15 48-37 0-21-17-37-42-37l-20-1-7-19c-13-35-45-58-82-58-47 0-86 38-86 85l-1 25-25 2c-17 1-30 14-30 31 0 17 14 31 31 31h42v56z"
    fill="#fff"
  />
  <!-- The note: its stem and its flag. -->
  <path d="M566 474h34v129c0 30-25 54-56 54s-56-24-56-54 25-54 56-54c8 0 16 2 22 5V474z" fill="#fff" />
  <path d="M600 474l72-24v62l-72 24z" fill="#fff" />
</svg>
